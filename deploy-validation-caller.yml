# End-to-end install validation for the sandbox deployment.
#
# The implementation lives in OKDP/gh-workflows so that the package repositories can
# run the same validation against candidate packages. This file owns only the
# triggers and the concurrency policy; everything it does is in the template.

name: Deploy validation (sandbox e2e)

on:
  pull_request:
    paths:
      - "clusters/**"
      - ".github/workflows/deploy-validation.yml"
  push:
    branches: [main]
    paths:
      - "clusters/**"
  workflow_dispatch:

concurrency:
  # A full install takes 9-15 minutes when it passes. Only the newest run per ref
  # is ever interesting.
  group: deploy-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-validation:
    uses: okdp/gh-workflows/.github/workflows/sandbox-e2e-template.yml@v1
    with:
      # Validate this repository's own manifests, at the commit under review rather
      # than at main.
      manifests_repository: ${{ github.repository }}
      manifests_ref: ${{ github.event.pull_request.head.sha || github.sha }}
